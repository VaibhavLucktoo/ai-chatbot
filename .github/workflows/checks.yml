name: checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_DB: chatbot_test
          POSTGRES_USER: chatbot_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatbot_test -d chatbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: chatbot_test
      POSTGRES_USER: chatbot_test
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --locked
      - run: uv run python -c "import psycopg; c=psycopg.connect('host=127.0.0.1 dbname=chatbot_test user=chatbot_test password=ci-only-password', autocommit=True); c.execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close()"
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -p no:cacheprovider
      - run: uv run alembic check
      - run: docker build -t chatbot-check .
  frontend-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: docker build -t chatbot-production .
